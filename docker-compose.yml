services:
  prometheus:
    image: prom/prometheus:latest
    container_name: byteguard-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: byteguard-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped